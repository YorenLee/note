<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">m（训练集大小）</text>
  <text x="100" y="64" text-anchor="end" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">成本</text>
  <!-- 区域标注 -->
  <text x="327" y="88" text-anchor="middle" font-size="12" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高方差：两条曲线之间有空隙，加数据能收窄</text>
  <!-- J_cv：从高处持续下降，仍高于 J_train -->
  <path d="M 110,110 C 190,140 290,180 390,215 C 470,240 520,255 540,262" fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="536" y="250" text-anchor="end" font-size="13" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_cv</text>
  <!-- J_train：一直很低 -->
  <path d="M 110,330 C 190,320 290,312 390,308 C 470,306 520,305 540,304" fill="none" stroke="#666666" stroke-width="2.5"/>
  <text x="536" y="316" text-anchor="end" font-size="13" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_train</text>
  <!-- 空隙标注 -->
  <line x1="522" y1="270" x2="522" y2="298" stroke="#999999" stroke-width="1.5"/>
  <line x1="518" y1="272" x2="522" y2="270" stroke="#999999" stroke-width="1.5"/>
  <line x1="526" y1="272" x2="522" y2="270" stroke="#999999" stroke-width="1.5"/>
  <line x1="518" y1="296" x2="522" y2="298" stroke="#999999" stroke-width="1.5"/>
  <line x1="526" y1="296" x2="522" y2="298" stroke="#999999" stroke-width="1.5"/>
  <text x="592" y="288" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">空隙</text>
</svg>
