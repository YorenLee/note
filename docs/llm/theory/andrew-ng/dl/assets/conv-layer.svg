<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 标题 -->
  <text x="170" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Dense 层</text>
  <text x="170" y="60" text-anchor="middle" font-size="12" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">每个神经元接收全部输入</text>
  <text x="500" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">卷积层</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">每个神经元只看一个局部窗口</text>
  <!-- Dense 全连接线（12 条） -->
  <g stroke="#999999" stroke-width="1" opacity="0.55">
    <line x1="130" y1="100" x2="240" y2="150"/><line x1="130" y1="100" x2="240" y2="300"/>
    <line x1="130" y1="150" x2="240" y2="150"/><line x1="130" y1="150" x2="240" y2="300"/>
    <line x1="130" y1="200" x2="240" y2="150"/><line x1="130" y1="200" x2="240" y2="300"/>
    <line x1="130" y1="250" x2="240" y2="150"/><line x1="130" y1="250" x2="240" y2="300"/>
    <line x1="130" y1="300" x2="240" y2="150"/><line x1="130" y1="300" x2="240" y2="300"/>
    <line x1="130" y1="350" x2="240" y2="150"/><line x1="130" y1="350" x2="240" y2="300"/>
  </g>
  <!-- 卷积窗口框 -->
  <rect x="402" y="76" width="56" height="148" rx="10" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="402" y="224" width="56" height="148" rx="10" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- 卷积局部连接线（6 条） -->
  <g stroke="#c0392b" stroke-width="1.5">
    <line x1="450" y1="100" x2="550" y2="150"/><line x1="450" y1="150" x2="550" y2="150"/><line x1="450" y1="200" x2="550" y2="150"/>
    <line x1="450" y1="250" x2="550" y2="300"/><line x1="450" y1="300" x2="550" y2="300"/><line x1="450" y1="350" x2="550" y2="300"/>
  </g>
  <!-- 左侧输入神经元 -->
  <g>
    <circle cx="110" cy="100" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="110" cy="150" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="110" cy="200" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="110" cy="250" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="110" cy="300" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="110" cy="350" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <text x="110" y="106" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">1</tspan></text>
    <text x="110" y="156" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">2</tspan></text>
    <text x="110" y="206" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">3</tspan></text>
    <text x="110" y="256" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">4</tspan></text>
    <text x="110" y="306" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">5</tspan></text>
    <text x="110" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">6</tspan></text>
  </g>
  <!-- Dense 输出神经元 -->
  <g>
    <circle cx="260" cy="150" r="20" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
    <circle cx="260" cy="300" r="20" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
    <text x="260" y="156" text-anchor="middle" font-size="14" font-style="italic" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="4" font-size="10">1</tspan></text>
    <text x="260" y="306" text-anchor="middle" font-size="14" font-style="italic" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="4" font-size="10">2</tspan></text>
  </g>
  <!-- 右侧输入神经元 -->
  <g>
    <circle cx="430" cy="100" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="430" cy="150" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="430" cy="200" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="430" cy="250" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="430" cy="300" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <circle cx="430" cy="350" r="20" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
    <text x="430" y="106" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">1</tspan></text>
    <text x="430" y="156" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">2</tspan></text>
    <text x="430" y="206" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">3</tspan></text>
    <text x="430" y="256" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">4</tspan></text>
    <text x="430" y="306" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">5</tspan></text>
    <text x="430" y="356" text-anchor="middle" font-size="14" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="10">6</tspan></text>
  </g>
  <!-- 卷积输出神经元 -->
  <g>
    <circle cx="570" cy="150" r="20" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
    <circle cx="570" cy="300" r="20" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
    <text x="570" y="156" text-anchor="middle" font-size="14" font-style="italic" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="4" font-size="10">1</tspan></text>
    <text x="570" y="306" text-anchor="middle" font-size="14" font-style="italic" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="4" font-size="10">2</tspan></text>
  </g>
  <!-- 底部说明 -->
  <text x="170" y="408" text-anchor="middle" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">12 条连接</text>
  <text x="170" y="428" text-anchor="middle" font-size="11" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">每个神经元连全部 6 个输入</text>
  <text x="500" y="408" text-anchor="middle" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">6 条连接</text>
  <text x="500" y="428" text-anchor="middle" font-size="11" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">每个神经元连窗口内的 3 个输入</text>
</svg>
