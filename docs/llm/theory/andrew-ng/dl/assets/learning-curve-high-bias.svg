<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">m（训练集大小）</text>
  <text x="100" y="64" text-anchor="end" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">成本</text>
  <!-- 区域标注 -->
  <text x="327" y="88" text-anchor="middle" font-size="12" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高偏差：曲线早早拉平，加数据没用</text>
  <!-- J_cv：从高处快速下降后拉平 -->
  <path d="M 110,105 C 170,150 240,195 330,225 C 420,238 490,241 540,240" fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="536" y="228" text-anchor="end" font-size="13" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_cv</text>
  <!-- J_train：从底部上升后拉平 -->
  <path d="M 110,348 C 180,305 250,270 330,258 C 410,252 490,251 540,250" fill="none" stroke="#666666" stroke-width="2.5"/>
  <text x="536" y="262" text-anchor="end" font-size="13" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_train</text>
</svg>
