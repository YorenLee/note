<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="step-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">模型训练三步曲</text>
  <!-- 三个步骤的方框 -->
  <rect x="30" y="60" width="180" height="180" rx="8" fill="#f5f8fb" stroke="#2a6fb0" stroke-width="1.5"/>
  <rect x="230" y="60" width="180" height="180" rx="8" fill="#f5f8fb" stroke="#2a6fb0" stroke-width="1.5"/>
  <rect x="430" y="60" width="180" height="180" rx="8" fill="#f5f8fb" stroke="#2a6fb0" stroke-width="1.5"/>
  <!-- 步骤间箭头 -->
  <line x1="214" y1="150" x2="226" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#step-arrow)"/>
  <line x1="414" y1="150" x2="426" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#step-arrow)"/>
  <!-- 步骤标题 -->
  <text x="120" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">① 定义模型</text>
  <text x="320" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">② 定义成本函数</text>
  <text x="520" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">③ 梯度下降</text>
  <!-- 方框 1：迷你网络结构 -->
  <line x1="70" y1="145" x2="120" y2="120" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="145" x2="120" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="145" x2="120" y2="220" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="195" x2="120" y2="120" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="195" x2="120" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="195" x2="120" y2="220" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="120" y1="120" x2="170" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="120" y1="170" x2="170" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="120" y1="220" x2="170" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <circle cx="70" cy="145" r="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <circle cx="70" cy="195" r="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <circle cx="120" cy="170" r="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <circle cx="120" cy="220" r="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <circle cx="170" cy="170" r="8" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <text x="120" y="215" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">选择网络结构</text>
  <!-- 方框 2：成本函数 -->
  <text x="320" y="145" text-anchor="middle" font-size="17" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J(w, b)</text>
  <text x="320" y="175" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">二元交叉熵</text>
  <text x="320" y="197" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">（逻辑回归的对数损失）</text>
  <!-- 方框 3：梯度下降 -->
  <path d="M 455 210 Q 520 130 585 210" fill="none" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="552" cy="180" r="4" fill="#c0392b"/>
  <circle cx="536" cy="172" r="4" fill="#c0392b"/>
  <circle cx="527" cy="170" r="4" fill="#c0392b"/>
  <text x="520" y="232" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J 逐步变小</text>
  <!-- 对应的 TensorFlow 代码 -->
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#555555" font-family="Menlo, Consolas, monospace">model = Sequential(...)</text>
  <text x="320" y="285" text-anchor="middle" font-size="11" fill="#555555" font-family="Menlo, Consolas, monospace">model.compile(loss=...)</text>
  <text x="520" y="285" text-anchor="middle" font-size="11" fill="#555555" font-family="Menlo, Consolas, monospace">model.fit(X, Y, ...)</text>
  <text x="320" y="420" text-anchor="middle" font-size="13" fill="#555555" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">选结构 → 定成本 → 梯度下降找参数，三步走完模型就训练好了</text>
</svg>
