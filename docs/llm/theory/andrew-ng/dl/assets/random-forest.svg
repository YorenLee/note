<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="rf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 列标题 -->
  <text x="95" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">原训练集</text>
  <text x="255" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">带替换采样</text>
  <text x="255" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">出 B 个训练集</text>
  <text x="430" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">训练 B 棵</text>
  <text x="430" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">决策树</text>
  <text x="575" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">投票</text>
  <!-- 原训练集 -->
  <rect x="50" y="95" width="90" height="140" rx="6" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <g fill="#2a6fb0">
    <circle cx="65" cy="115" r="3"/><circle cx="85" cy="115" r="3"/><circle cx="105" cy="115" r="3"/>
    <circle cx="65" cy="135" r="3"/><circle cx="85" cy="135" r="3"/><circle cx="105" cy="135" r="3"/>
    <circle cx="65" cy="155" r="3"/><circle cx="85" cy="155" r="3"/><circle cx="105" cy="155" r="3"/>
    <circle cx="65" cy="175" r="3"/><circle cx="85" cy="175" r="3"/><circle cx="105" cy="175" r="3"/>
    <circle cx="65" cy="195" r="3"/><circle cx="85" cy="195" r="3"/><circle cx="105" cy="195" r="3"/>
    <circle cx="65" cy="215" r="3"/><circle cx="85" cy="215" r="3"/><circle cx="105" cy="215" r="3"/>
  </g>
  <text x="95" y="255" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">m 个样本</text>
  <!-- 箭头：原集 → 采样集 -->
  <line x1="140" y1="165" x2="206" y2="125" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="140" y1="165" x2="206" y2="195" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="140" y1="165" x2="206" y2="265" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <!-- 采样集 -->
  <g stroke="#999999" stroke-width="1.5">
    <rect x="210" y="100" width="90" height="50" rx="6" fill="#ffffff"/>
    <rect x="210" y="170" width="90" height="50" rx="6" fill="#ffffff"/>
    <rect x="210" y="240" width="90" height="50" rx="6" fill="#ffffff"/>
  </g>
  <g fill="#2a6fb0">
    <circle cx="225" cy="115" r="3"/><circle cx="255" cy="115" r="3"/><circle cx="225" cy="135" r="3"/><circle cx="255" cy="135" r="3"/>
    <circle cx="225" cy="185" r="3"/><circle cx="255" cy="185" r="3"/><circle cx="225" cy="205" r="3"/><circle cx="255" cy="205" r="3"/>
    <circle cx="225" cy="255" r="3"/><circle cx="255" cy="255" r="3"/><circle cx="225" cy="275" r="3"/><circle cx="255" cy="275" r="3"/>
  </g>
  <text x="255" y="320" text-anchor="middle" font-size="16" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">…</text>
  <!-- 箭头：采样集 → 决策树 -->
  <line x1="300" y1="125" x2="401" y2="125" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="300" y1="195" x2="401" y2="195" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="300" y1="265" x2="401" y2="265" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <!-- 决策树 -->
  <g>
    <line x1="415" y1="131" x2="397" y2="146" stroke="#999999" stroke-width="1.5"/>
    <line x1="415" y1="131" x2="433" y2="146" stroke="#999999" stroke-width="1.5"/>
    <line x1="415" y1="201" x2="397" y2="216" stroke="#999999" stroke-width="1.5"/>
    <line x1="415" y1="201" x2="433" y2="216" stroke="#999999" stroke-width="1.5"/>
    <line x1="415" y1="271" x2="397" y2="286" stroke="#999999" stroke-width="1.5"/>
    <line x1="415" y1="271" x2="433" y2="286" stroke="#999999" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="415" cy="125" r="7" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
    <circle cx="397" cy="149" r="6" fill="#c0392b"/><circle cx="433" cy="149" r="6" fill="#c0392b"/>
    <circle cx="415" cy="195" r="7" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
    <circle cx="397" cy="219" r="6" fill="#c0392b"/><circle cx="433" cy="219" r="6" fill="#c0392b"/>
    <circle cx="415" cy="265" r="7" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
    <circle cx="397" cy="289" r="6" fill="#c0392b"/><circle cx="433" cy="289" r="6" fill="#c0392b"/>
  </g>
  <!-- 箭头：树 → 投票 -->
  <line x1="441" y1="149" x2="526" y2="132" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="441" y1="219" x2="526" y2="145" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <line x1="441" y1="289" x2="526" y2="158" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <!-- 投票框与预测 -->
  <rect x="530" y="100" width="90" height="90" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="575" y="133" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">分类取多数</text>
  <text x="575" y="155" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">回归取平均</text>
  <line x1="575" y1="190" x2="575" y2="226" stroke="#999999" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <text x="575" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">预测结果</text>
  <!-- 底部说明 -->
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">随机森林比装袋多的一步：每个节点只从随机抽出的 k 个特征里挑最优分裂</text>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">（常用 k = √n），其余与装袋相同</text>
</svg>
