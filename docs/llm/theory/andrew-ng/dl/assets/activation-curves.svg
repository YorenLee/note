<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- Sigmoid：S 形曲线 -->
  <text x="320" y="36" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Sigmoid：g(z) = 1 / (1 + e^(-z))</text>
  <line x1="100" y1="130" x2="500" y2="130" stroke="#666666" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="140" stroke="#666666" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="500" y2="90" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="94" y="94" text-anchor="end" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">0.5</text>
  <path d="M 100 129 C 170 126, 230 108, 300 90 S 430 72, 500 51" fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="510" y="133" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">z</text>
  <text x="92" y="46" text-anchor="end" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a</text>
  <!-- ReLU：拐折线 -->
  <text x="320" y="186" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">ReLU：g(z) = max(0, z)</text>
  <line x1="100" y1="280" x2="500" y2="280" stroke="#666666" stroke-width="1.5"/>
  <line x1="100" y1="200" x2="100" y2="290" stroke="#666666" stroke-width="1.5"/>
  <path d="M 100 280 L 300 280 L 500 200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="510" y="283" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">z</text>
  <text x="92" y="196" text-anchor="end" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">g(z)</text>
  <!-- 线性激活：直线 -->
  <text x="320" y="336" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">线性：g(z) = z</text>
  <line x1="100" y1="435" x2="500" y2="435" stroke="#666666" stroke-width="1.5"/>
  <line x1="100" y1="300" x2="100" y2="445" stroke="#666666" stroke-width="1.5"/>
  <path d="M 100 435 L 500 275" fill="none" stroke="#666666" stroke-width="2.5"/>
  <text x="510" y="438" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">z</text>
  <text x="92" y="296" text-anchor="end" font-size="13" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">g(z)</text>
</svg>
