<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">p₁（正例占比）</text>
  <text x="100" y="64" text-anchor="end" font-size="14" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">H(p₁)</text>
  <!-- 参考线 -->
  <line x1="110" y1="75" x2="540" y2="75" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="104" y="79" text-anchor="end" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">1</text>
  <line x1="325" y1="75" x2="325" y2="360" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="110" y="378" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">0</text>
  <text x="325" y="378" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">0.5</text>
  <text x="540" y="378" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">1</text>
  <!-- 熵曲线 -->
  <polyline points="110,360 153,226.3 196,154.2 239,108.9 282,83.3 325,75 368,83.3 411,108.9 454,154.2 497,226.3 540,360" fill="none" stroke="#2a6fb0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 标注 -->
  <text x="120" y="348" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">H = 0，全纯</text>
  <text x="325" y="100" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">H = 1，最混乱</text>
</svg>
