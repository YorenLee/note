<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="tree-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 连接线与答案标注 -->
  <line x1="290" y1="70" x2="204" y2="138" stroke="#999999" stroke-width="1.5" marker-end="url(#tree-arrow)"/>
  <text x="236" y="100" font-size="13" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">是</text>
  <line x1="350" y1="70" x2="476" y2="138" stroke="#999999" stroke-width="1.5" marker-end="url(#tree-arrow)"/>
  <text x="420" y="100" font-size="13" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">否</text>
  <line x1="186" y1="180" x2="114" y2="248" stroke="#999999" stroke-width="1.5" marker-end="url(#tree-arrow)"/>
  <text x="140" y="222" font-size="13" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">是</text>
  <line x1="214" y1="180" x2="286" y2="248" stroke="#999999" stroke-width="1.5" marker-end="url(#tree-arrow)"/>
  <text x="256" y="222" font-size="13" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">否</text>
  <!-- 根节点 -->
  <rect x="270" y="30" width="100" height="40" rx="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">耳朵尖吗？</text>
  <text x="320" y="88" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">根节点</text>
  <!-- 决策节点 -->
  <rect x="150" y="140" width="100" height="40" rx="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">脸型圆吗？</text>
  <text x="200" y="198" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">决策节点</text>
  <!-- 叶节点 -->
  <rect x="430" y="140" width="100" height="40" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="165" text-anchor="middle" font-size="14" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">不是猫</text>
  <text x="480" y="198" text-anchor="middle" font-size="11" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">叶节点</text>
  <rect x="60" y="250" width="100" height="40" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="275" text-anchor="middle" font-size="14" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">猫</text>
  <rect x="240" y="250" width="100" height="40" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="275" text-anchor="middle" font-size="14" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">不是猫</text>
  <!-- 底部说明 -->
  <text x="320" y="380" text-anchor="middle" font-size="13" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">蓝色节点是决策节点（继续提问），红色节点是叶节点（给出预测）</text>
</svg>
