  <text x="115" y="405" text-anchor="middle" font-size="12" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高方差 · 过拟合</text>
  <!-- 面板二：λ 适中（恰好） -->
