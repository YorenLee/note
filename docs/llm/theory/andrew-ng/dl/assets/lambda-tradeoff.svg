  <text x="320" y="405" text-anchor="middle" font-size="12" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">恰好拟合</text>
  <!-- 面板三：λ 很大（高偏差） -->
  <line x1="450" y1="70" x2="450" y2="335" stroke="#666666" stroke-width="1.5"/>
  <line x1="450" y1="335" x2="600" y2="335" stroke="#666666" stroke-width="1.5"/>
