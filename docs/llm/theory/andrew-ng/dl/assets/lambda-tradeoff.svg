  <polyline points="245,137.4 266.75,234.3 288.5,292.4 310.25,311.8 332,292.4 353.75,234.3 375.5,137.4 382.75,96.5" fill="none" stroke="#2a6fb0" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#2a6fb0">
