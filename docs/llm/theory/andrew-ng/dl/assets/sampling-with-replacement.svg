  <text x="320" y="395" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">红色数字 = 重复抽到的样本，有的样本一次都没被抽到</text>
