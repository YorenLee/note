<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="14" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">λ</text>
  <text x="100" y="64" text-anchor="end" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">成本</text>
  <!-- 区域标注 -->
  <text x="185" y="92" text-anchor="middle" font-size="12" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">λ 太小 · 过拟合</text>
  <text x="470" y="92" text-anchor="middle" font-size="12" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">λ 太大 · 欠拟合</text>
  <!-- J_train：随 λ 单调上升 -->
  <path d="M 110,348 C 190,344 280,330 350,295 C 410,265 480,230 540,208" fill="none" stroke="#666666" stroke-width="2.5"/>
  <text x="536" y="196" text-anchor="end" font-size="13" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_train</text>
  <!-- J_cv：先降后升 -->
  <path d="M 110,120 C 190,140 260,220 330,300 C 400,320 480,250 540,212" fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="536" y="232" text-anchor="end" font-size="13" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_cv</text>
  <!-- 最佳 λ -->
  <line x1="330" y1="300" x2="330" y2="360" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="330" cy="300" r="4" fill="#2a6fb0"/>
  <text x="330" y="388" text-anchor="middle" font-size="13" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">J_cv 谷底 = 最佳 λ</text>
</svg>
