<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="nn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 连接线（输入层 → 隐藏层） -->
  <line x1="172.2" y1="165.8" x2="307.9" y2="109.2" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="173.0" y1="182.0" x2="307.1" y2="223.0" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="166.7" y1="192.2" x2="313.3" y2="342.8" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="166.7" y1="267.8" x2="313.3" y2="117.2" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="173.0" y1="278.0" x2="307.1" y2="237.0" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="172.2" y1="294.2" x2="307.9" y2="350.8" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <!-- 连接线（隐藏层 → 输出层） -->
  <line x1="349.5" y1="114.1" x2="490.5" y2="216.0" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="354.0" y1="230.0" x2="486.0" y2="230.0" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <line x1="349.5" y1="345.9" x2="490.5" y2="244.0" stroke="#999999" stroke-width="1.5" marker-end="url(#nn-arrow)"/>
  <!-- 连接上的参数标注 -->
  <text x="240" y="125" text-anchor="middle" font-size="13" font-style="italic" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">w<tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="10">[1]</tspan>, b<tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="10">[1]</tspan></text>
  <!-- 输入层神经元 -->
  <circle cx="150" cy="175" r="24" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="150" cy="285" r="24" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <text x="150" y="181" text-anchor="middle" font-size="16" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="11">1</tspan></text>
  <text x="150" y="291" text-anchor="middle" font-size="16" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x<tspan dy="4" font-size="11">2</tspan></text>
  <text x="150" y="222" text-anchor="middle" font-size="13" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">温度</text>
  <text x="150" y="332" text-anchor="middle" font-size="13" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">时间</text>
  <!-- 隐藏层神经元 -->
  <circle cx="330" cy="100" r="24" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="330" cy="230" r="24" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="330" cy="360" r="24" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <text x="330" y="106" text-anchor="middle" font-size="16" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="-7" font-size="11">[1]</tspan><tspan dy="11" font-size="11">1</tspan></text>
  <text x="330" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="-7" font-size="11">[1]</tspan><tspan dy="11" font-size="11">2</tspan></text>
  <text x="330" y="366" text-anchor="middle" font-size="16" font-style="italic" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="-7" font-size="11">[1]</tspan><tspan dy="11" font-size="11">3</tspan></text>
  <!-- 输出层神经元 -->
  <circle cx="510" cy="230" r="24" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a<tspan dy="-7" font-size="11">[2]</tspan></text>
  <text x="510" y="278" text-anchor="middle" font-size="13" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">预测值 ŷ</text>
  <!-- 层名称 -->
  <text x="150" y="420" text-anchor="middle" font-size="15" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">输入层</text>
  <text x="150" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">input layer</text>
  <text x="330" y="420" text-anchor="middle" font-size="15" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">隐藏层</text>
  <text x="330" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">hidden layer</text>
  <text x="510" y="420" text-anchor="middle" font-size="15" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">输出层</text>
  <text x="510" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">output layer</text>
  <!-- 神经元内部计算 -->
  <rect x="395" y="18" width="235" height="88" rx="8" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="512.5" y="42" text-anchor="middle" font-size="13" fill="#555555" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">每个神经元</text>
  <text x="512.5" y="66" text-anchor="middle" font-size="13" font-style="italic" fill="#555555" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">z = w · a + b</text>
  <text x="512.5" y="90" text-anchor="middle" font-size="13" font-style="italic" fill="#555555" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">a = g(z)</text>
</svg>
