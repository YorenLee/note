<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">召回率</text>
  <text x="100" y="64" text-anchor="end" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">精确率</text>
  <!-- 精确率-召回率曲线：一条线 -->
  <path d="M 110,90 C 250,100 380,170 470,280 C 510,325 530,345 540,352" fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <!-- 两端标注 -->
  <circle cx="110" cy="90" r="4" fill="#2a6fb0"/>
  <text x="120" y="82" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高阈值：少而准</text>
  <circle cx="540" cy="352" r="4" fill="#2a6fb0"/>
  <text x="530" y="330" text-anchor="end" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">低阈值：多而全</text>
</svg>
