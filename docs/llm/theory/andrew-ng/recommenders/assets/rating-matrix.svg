<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 表头 -->
  <text x="180" y="122" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">电影 ╲ 用户</text>
  <text x="250" y="122" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">小明</text>
  <text x="320" y="122" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">小红</text>
  <text x="390" y="122" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">小刚</text>
  <text x="460" y="122" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">小芳</text>
  <!-- 行标签 -->
  <g font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="180" y="154" text-anchor="middle">爱到最后</text>
    <text x="180" y="186" text-anchor="middle">浪漫一生</text>
    <text x="180" y="218" text-anchor="middle">可爱小狗</text>
    <text x="180" y="250" text-anchor="middle">极速飙车</text>
    <text x="180" y="282" text-anchor="middle">剑与空手道</text>
  </g>
  <!-- 评分值 -->
  <g font-size="12" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="250" y="154" fill="#333333">5</text><text x="320" y="154" fill="#333333">5</text>
    <text x="390" y="154" fill="#666666">?</text><text x="460" y="154" fill="#333333">0</text>
    <text x="250" y="186" fill="#333333">5</text><text x="320" y="186" fill="#666666">?</text>
    <text x="390" y="186" fill="#333333">4</text><text x="460" y="186" fill="#333333">0</text>
    <text x="250" y="218" fill="#333333">0</text><text x="320" y="218" fill="#666666">?</text>
    <text x="390" y="218" fill="#333333">0</text><text x="460" y="218" fill="#333333">5</text>
    <text x="250" y="250" fill="#333333">0</text><text x="320" y="250" fill="#333333">0</text>
    <text x="390" y="250" fill="#666666">?</text><text x="460" y="250" fill="#333333">4</text>
    <text x="250" y="282" fill="#333333">0</text><text x="320" y="282" fill="#666666">?</text>
    <text x="390" y="282" fill="#666666">?</text><text x="460" y="282" fill="#666666">?</text>
  </g>
  <!-- 表格线 -->
  <g stroke="#999999" stroke-width="1" fill="none">
    <rect x="145" y="100" width="350" height="192"/>
    <line x1="215" y1="100" x2="215" y2="292"/>
    <line x1="285" y1="100" x2="285" y2="292"/>
    <line x1="355" y1="100" x2="355" y2="292"/>
    <line x1="425" y1="100" x2="425" y2="292"/>
    <line x1="145" y1="132" x2="495" y2="132"/>
    <line x1="145" y1="164" x2="495" y2="164"/>
    <line x1="145" y1="196" x2="495" y2="196"/>
    <line x1="145" y1="228" x2="495" y2="228"/>
    <line x1="145" y1="260" x2="495" y2="260"/>
  </g>
  <!-- 高亮要预测的位置 -->
  <rect x="285" y="164" width="70" height="32" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- 底部说明 -->
  <text x="320" y="335" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">红框里的「?」就是要预测的位置：用已知评分（数字）推出所有空白</text>
</svg>
