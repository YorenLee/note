<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="75" x2="110" y2="340" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="340" x2="545" y2="340" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="345" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">浪漫程度 x₁</text>
  <text x="100" y="70" text-anchor="end" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">动作程度 x₂</text>
  <g font-size="11" text-anchor="middle" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="110" y="358">0</text><text x="540" y="358">1</text>
  </g>
  <!-- 电影位置 -->
  <g fill="#2a6fb0">
    <circle cx="497" cy="340" r="4"/>
    <circle cx="540" cy="337.35" r="4"/>
    <circle cx="535.7" cy="340" r="4"/>
    <circle cx="153" cy="75" r="4"/>
    <circle cx="110" cy="101.5" r="4"/>
  </g>
  <g font-size="11" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="497" y="365" text-anchor="middle">爱到最后</text>
    <text x="540" y="315" text-anchor="middle">浪漫一生</text>
    <text x="535.7" y="328" text-anchor="middle">可爱小狗</text>
    <text x="160" y="70" text-anchor="middle">极速飙车</text>
    <text x="118" y="80" text-anchor="middle">剑与空手道</text>
  </g>
  <!-- 底部说明 -->
  <text x="327" y="400" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">浪漫片在右下、动作片在左上：每部电影的位置就是它的特征 x</text>
</svg>
