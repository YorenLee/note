<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="km-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 面板间箭头 -->
  <line x1="300" y1="110" x2="336" y2="110" stroke="#999999" stroke-width="1.5" marker-end="url(#km-arrow)"/>
  <line x1="470" y1="200" x2="470" y2="238" stroke="#999999" stroke-width="1.5" marker-end="url(#km-arrow)"/>
  <line x1="300" y1="325" x2="336" y2="325" stroke="#999999" stroke-width="1.5" marker-end="url(#km-arrow)"/>
  <!-- ① 随机初始中心：所有点灰色 -->
  <g fill="#999999">
    <circle cx="100" cy="178.5" r="4"/><circle cx="88" cy="163" r="4"/><circle cx="124" cy="170.75" r="4"/>
    <circle cx="112" cy="194" r="4"/><circle cx="107.2" cy="155.25" r="4"/><circle cx="126.4" cy="186.25" r="4"/>
    <circle cx="220" cy="116.5" r="4"/><circle cx="208" cy="101" r="4"/><circle cx="232" cy="124.25" r="4"/>
    <circle cx="220" cy="93.25" r="4"/><circle cx="244" cy="108.75" r="4"/><circle cx="196" cy="116.5" r="4"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="106" y1="110.5" x2="118" y2="110.5"/><line x1="112" y1="104.5" x2="112" y2="116.5"/>
    <line x1="226" y1="186.25" x2="238" y2="186.25"/><line x1="232" y1="180.25" x2="232" y2="192.25"/>
  </g>
  <!-- ② 点归最近的中心 -->
  <g fill="#c0392b">
    <circle cx="400" cy="178.5" r="4"/><circle cx="388" cy="163" r="4"/><circle cx="424" cy="170.75" r="4"/>
    <circle cx="412" cy="194" r="4"/><circle cx="407.2" cy="155.25" r="4"/><circle cx="426.4" cy="186.25" r="4"/>
  </g>
  <g fill="#2a6fb0">
    <circle cx="520" cy="116.5" r="4"/><circle cx="508" cy="101" r="4"/><circle cx="532" cy="124.25" r="4"/>
    <circle cx="520" cy="93.25" r="4"/><circle cx="544" cy="108.75" r="4"/><circle cx="496" cy="116.5" r="4"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="406" y1="110.5" x2="418" y2="110.5"/><line x1="412" y1="104.5" x2="412" y2="116.5"/>
    <line x1="526" y1="186.25" x2="538" y2="186.25"/><line x1="532" y1="180.25" x2="532" y2="192.25"/>
  </g>
  <!-- ③ 中心移到均值 -->
  <g fill="#c0392b">
    <circle cx="100" cy="178.5" r="4"/><circle cx="88" cy="163" r="4"/><circle cx="124" cy="170.75" r="4"/>
    <circle cx="112" cy="194" r="4"/><circle cx="107.2" cy="155.25" r="4"/><circle cx="126.4" cy="186.25" r="4"/>
  </g>
  <g fill="#2a6fb0">
    <circle cx="220" cy="116.5" r="4"/><circle cx="208" cy="101" r="4"/><circle cx="232" cy="124.25" r="4"/>
    <circle cx="220" cy="93.25" r="4"/><circle cx="244" cy="108.75" r="4"/><circle cx="196" cy="116.5" r="4"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="103.6" y1="174.625" x2="115.6" y2="174.625"/><line x1="109.6" y1="168.625" x2="109.6" y2="180.625"/>
    <line x1="214" y1="110.039" x2="226" y2="110.039"/><line x1="220" y1="104.039" x2="220" y2="116.039"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="112" y1="104.5" x2="109.6" y2="168.625"/>
    <line x1="232" y1="192.25" x2="220" y2="116.039"/>
  </g>
  <!-- ④ 重复到收敛 -->
  <g fill="#c0392b">
    <circle cx="400" cy="178.5" r="4"/><circle cx="388" cy="163" r="4"/><circle cx="424" cy="170.75" r="4"/>
    <circle cx="412" cy="194" r="4"/><circle cx="407.2" cy="155.25" r="4"/><circle cx="426.4" cy="186.25" r="4"/>
  </g>
  <g fill="#2a6fb0">
    <circle cx="520" cy="116.5" r="4"/><circle cx="508" cy="101" r="4"/><circle cx="532" cy="124.25" r="4"/>
    <circle cx="520" cy="93.25" r="4"/><circle cx="544" cy="108.75" r="4"/><circle cx="496" cy="116.5" r="4"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="403.6" y1="174.625" x2="415.6" y2="174.625"/><line x1="409.6" y1="168.625" x2="409.6" y2="180.625"/>
    <line x1="514" y1="110.039" x2="526" y2="110.039"/><line x1="520" y1="104.039" x2="520" y2="116.039"/>
  </g>
  <!-- 面板标题 -->
  <g font-size="12" text-anchor="middle" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="170" y="222">① 随机初始中心</text>
    <text x="470" y="222">② 点归最近的中心</text>
    <text x="170" y="437">③ 中心移到均值</text>
    <text x="470" y="437">④ 重复到收敛</text>
  </g>
</svg>
