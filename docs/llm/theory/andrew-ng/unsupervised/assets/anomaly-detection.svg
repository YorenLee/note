<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="14" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x₁</text>
  <text x="100" y="64" text-anchor="end" font-size="14" font-style="italic" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">x₂</text>
  <!-- p(x) 等高线 -->
  <ellipse cx="349.25" cy="229.5" rx="121.8" ry="40.6" fill="none" stroke="#2a6fb0" stroke-width="1.5" opacity="0.55"/>
  <ellipse cx="349.25" cy="229.5" rx="174" ry="58" fill="none" stroke="#2a6fb0" stroke-width="1.5" opacity="0.35"/>
  <ellipse cx="349.25" cy="229.5" rx="226.2" ry="75.4" fill="none" stroke="#2a6fb0" stroke-width="1.5" opacity="0.2"/>
  <!-- 正常样本 -->
  <g fill="#2a6fb0">
    <circle cx="284" cy="238.2" r="4"/><circle cx="305.75" cy="215" r="4"/><circle cx="327.5" cy="244" r="4"/>
    <circle cx="349.25" cy="220.8" r="4"/><circle cx="371" cy="238.2" r="4"/><circle cx="392.75" cy="215" r="4"/>
    <circle cx="414.5" cy="229.5" r="4"/><circle cx="327.5" cy="258.5" r="4"/><circle cx="362.3" cy="200.5" r="4"/>
    <circle cx="318.8" cy="200.5" r="4"/><circle cx="379.7" cy="258.5" r="4"/><circle cx="292.7" cy="220.8" r="4"/>
    <circle cx="405.8" cy="209.2" r="4"/><circle cx="340.55" cy="273" r="4"/>
  </g>
  <!-- 异常样本 -->
  <circle cx="188.3" cy="122.2" r="5" fill="#c0392b"/>
  <text x="188.3" y="96" text-anchor="middle" font-size="12" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">异常样本</text>
  <line x1="188.3" y1="101" x2="188.3" y2="114" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ad-arrow)"/>
  <!-- 标注 -->
  <text x="349.25" y="160" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">正常样本</text>
  <text x="520" y="140" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">p(x) 等高线</text>
  <!-- 底部说明 -->
  <text x="327" y="400" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">落在等高线之外的样本 p(x) 很小：p(x) &lt; ε 判为异常，ε 用交叉验证集调</text>
</svg>
