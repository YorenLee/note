<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- 坐标轴 -->
  <line x1="110" y1="70" x2="110" y2="360" stroke="#666666" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="545" y2="360" stroke="#666666" stroke-width="1.5"/>
  <text x="552" y="365" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">K（簇的个数）</text>
  <text x="100" y="64" text-anchor="end" font-size="14" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">成本 J</text>
  <!-- K 刻度 -->
  <g font-size="11" text-anchor="middle" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="110" y="378">1</text><text x="172.1" y="378">2</text><text x="234.3" y="378">3</text>
    <text x="296.4" y="378">4</text><text x="358.6" y="378">5</text><text x="420.7" y="378">6</text>
    <text x="482.9" y="378">7</text><text x="545" y="378">8</text>
  </g>
  <!-- J 曲线 -->
  <polyline points="110,75 172.1,189 234.3,274.5 296.4,288.75 358.6,297.3 420.7,303 482.9,305.85 545,307.3" fill="none" stroke="#2a6fb0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 肘部标注 -->
  <circle cx="234.3" cy="274.5" r="13" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="234.3" y="248" text-anchor="middle" font-size="12" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">肘部：K = 3</text>
  <text x="420" y="235" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">之后下降变缓</text>
</svg>
