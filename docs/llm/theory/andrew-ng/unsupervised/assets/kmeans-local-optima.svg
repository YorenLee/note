    <circle cx="376" cy="48.25" r="4"/><circle cx="388" cy="63.75" r="4"/><circle cx="412" cy="56" r="4"/>
  </g>
  <g fill="#2a6fb0">
    <circle cx="436" cy="48.25" r="4"/><circle cx="448" cy="68.4" r="4"/><circle cx="460" cy="52.9" r="4"/>
    <circle cx="520" cy="63.75" r="4"/><circle cx="544" cy="48.25" r="4"/><circle cx="508" cy="79.25" r="4"/>
    <circle cx="532" cy="71.5" r="4"/>
  </g>
  <g fill="#2e8b57">
