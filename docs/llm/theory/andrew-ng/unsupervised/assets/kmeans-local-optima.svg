  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">随机初始化不同，收敛结果可能不同；多跑几次，选 J 最小的那次</text>
