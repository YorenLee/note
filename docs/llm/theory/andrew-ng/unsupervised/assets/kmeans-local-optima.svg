  <!-- 标题与说明 -->
  <text x="170" y="222" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">初始中心好：三个中心各归一个簇，J 更小</text>
