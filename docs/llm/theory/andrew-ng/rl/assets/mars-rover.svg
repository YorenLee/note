<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <marker id="rv-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>
  <!-- γ 标注 -->
  <text x="60" y="160" text-anchor="middle" font-size="13" font-style="italic" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">γ = 0.5</text>
  <!-- 状态 -->
  <circle cx="120" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="200" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="280" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="360" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="440" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="520" cy="150" r="28" fill="#ffffff" stroke="#2a6fb0" stroke-width="2"/>
  <g font-size="14" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="120" y="156" fill="#333333">1</text><text x="200" y="156" fill="#333333">2</text>
    <text x="280" y="156" fill="#333333">3</text><text x="360" y="156" fill="#333333">4</text>
    <text x="440" y="156" fill="#333333">5</text><text x="520" y="156" fill="#333333">6</text>
  </g>
  <!-- 奖励标注 -->
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">奖励 100</text>
  <text x="520" y="95" text-anchor="middle" font-size="12" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">奖励 40</text>
  <g font-size="11" text-anchor="middle" fill="#999999" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="200" y="100">0</text><text x="280" y="100">0</text><text x="360" y="100">0</text><text x="440" y="100">0</text>
  </g>
  <!-- 火星车在状态 4 -->
  <circle cx="360" cy="188" r="8" fill="#c0392b"/>
  <text x="360" y="215" text-anchor="middle" font-size="11" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">火星车</text>
  <!-- 动作箭头 -->
  <line x1="325" y1="188" x2="244" y2="188" stroke="#2a6fb0" stroke-width="1.5" marker-end="url(#rv-arrow)"/>
  <text x="284" y="180" text-anchor="middle" font-size="11" fill="#2a6fb0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">往左</text>
  <line x1="395" y1="188" x2="476" y2="188" stroke="#999999" stroke-width="1.5" marker-end="url(#rv-arrow)"/>
  <text x="436" y="180" text-anchor="middle" font-size="11" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">往右</text>
  <!-- 回报计算 -->
  <rect x="110" y="265" width="240" height="60" rx="8" fill="#ffffff" stroke="#2a6fb0" stroke-width="1.5"/>
  <text x="230" y="287" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">往左：0 + 0.5×0 + 0.25×0</text>
  <text x="230" y="307" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">+ 0.125×100 = 12.5</text>
  <rect x="390" y="265" width="240" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="510" y="287" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">往右：0 + 0.5×0</text>
  <text x="510" y="307" text-anchor="middle" font-size="12" fill="#333333" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">+ 0.25×40 = 10</text>
  <!-- 结论 -->
  <text x="320" y="365" text-anchor="middle" font-size="13" fill="#c0392b" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">往左的回报更大（12.5 &gt; 10），状态 4 的最优动作是往左</text>
</svg>
